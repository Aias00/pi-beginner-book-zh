<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050" role="img" aria-labelledby="title desc">
  <title id="title">一次读取任务的模型与工具循环</title>
  <desc id="desc">用户要求读说明。模型先生成读取请求，程序执行读取并获得文件结果，再把结果交给模型，最后生成有依据的回答。</desc>
  <rect width="1400" height="1050" rx="24" fill="#f7f8f6"/>
  <g font-family="Hiragino Sans GB, PingFang SC, sans-serif" text-anchor="middle">
    <text x="700" y="80" font-size="40" fill="#142c3c">一次任务，可能需要多轮模型请求</text>
    <g fill="#fff" stroke="#a8babf" stroke-width="2">
      <rect x="180" y="130" width="1040" height="100" rx="15"/>
      <rect x="180" y="300" width="1040" height="100" rx="15"/>
      <rect x="180" y="470" width="1040" height="100" rx="15"/>
      <rect x="180" y="640" width="1040" height="100" rx="15"/>
      <rect x="180" y="810" width="1040" height="100" rx="15"/>
    </g>
    <g font-size="32" fill="#142c3c">
      <text x="700" y="190">用户：请读取 README.md，介绍这个项目</text>
      <text x="700" y="360">第一轮模型响应：提出 read 调用</text>
      <text x="700" y="530">Pi 校验参数并执行工具：得到文件内容</text>
      <text x="700" y="700">下一轮模型请求：携带工具结果</text>
      <text x="700" y="870">模型生成有依据的回答；有新工具请求则继续</text>
    </g>
    <text x="700" y="990" font-size="26" fill="#69766f">示意流程，不是实测日志；工具请求、实际操作和回答是不同步骤。</text>
  </g>
  <g stroke="#6a8f9a" stroke-width="4" fill="none">
    <path d="M700 240v45M700 410v45M700 580v45M700 750v45"/>
  </g>
  <g fill="#6a8f9a">
    <path d="M700 285l-10-17h20zM700 455l-10-17h20zM700 625l-10-17h20zM700 795l-10-17h20z"/>
  </g>
</svg>
